{% extends "base.html" %}

{% block title %}Sign In — SmartSupport AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="saas-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.4rem;">
            <i class="bi bi-shield-lock"></i>
          </div>
          <h3 class="fw-bold text-dark">Welcome Back</h3>
          <p class="text-muted small">Sign in to your customer or support account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@company.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
          </button>

          <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold small text-decoration-none ms-1">Create one now</a>
          </div>
        </form>
      </div>

      <!-- Quick Role Reference for Demo / Viva presentation -->
      <div class="saas-card p-3 mt-3 bg-light border-0 text-center text-muted small">
        <i class="bi bi-info-circle me-1"></i> Customer and Support roles share the unified authentication portal.
      </div>
    </div>
  </div>
</div>
{% endblock %}
