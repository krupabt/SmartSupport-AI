{% extends "base.html" %}

{% block title %}500 Server Error — SmartSupport AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="saas-card p-5">
        <div class="text-warning mb-3" style="font-size: 3.5rem;">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h2 class="fw-bold text-dark">500 — Server Error</h2>
        <p class="text-muted mb-4">
          An unexpected server error occurred while processing your request. Our engineering team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
